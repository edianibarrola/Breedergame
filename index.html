<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#54876a"><title>Little Bloodlines · Habitat Workshop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#233e34;font-family:system-ui,sans-serif;color:#483629}body{display:grid;place-items:center}
main{position:relative;width:min(100vw,56.25vh);width:min(100vw,56.25dvh);height:min(100vh,177.7778vw);height:min(100dvh,177.7778vw);background:#e9dfc9}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:32px;text-align:center;background:#f8e8c9}
h1{font-size:30px;margin:0}p{font-size:15px;line-height:1.5;margin:0}progress{accent-color:#54876a;width:80%;height:18px}

</style></head><body><main>
<canvas id="game" tabindex="0" aria-label="Interactive enclosure customization workshop"></canvas>
<section id="loading"><h1>Little Bloodlines</h1><p>Build a little room to grow.</p><progress id="progress" max="1" value="0"></progress><p id="status">Loading the offline habitat workshop…</p><button id="retry" type="button">Try again</button></section>
</main><script src="Build/HabitatWeb.loader.js"></script><script>
const canvas=document.getElementById('game'), overlay=document.getElementById('loading');

createUnityInstance(canvas,{"dataUrl":"Build/HabitatWeb.data","frameworkUrl":"Build/HabitatWeb.framework.js","codeUrl":"Build/HabitatWeb.wasm","streamingAssetsUrl":"StreamingAssets","companyName":"LittleBloodlines","productName":"Little Bloodlines · Habitat Workshop","productVersion":"0.2.0"},p=>document.getElementById('progress').value=p).then(instance=>{

}).catch(error=>{

});
</script></body></html>
